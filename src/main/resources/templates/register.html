<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Join GrocCompare</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body style="background: var(--grey-100); height: 100vh; display: flex; align-items: center; justify-content: center;">

    <div style="background: var(--white); padding: 40px; border-radius: 24px; box-shadow: var(--shadow-light); width: 350px; text-align: center;">
        <h2 style="margin-bottom: 20px;">Create Account</h2>
        
        <form th:action="@{/register}" method="post">
            <input type="text" name="username" placeholder="Choose Username" required
                   style="width:100%; margin-bottom:15px; padding:12px; border:1px solid var(--grey-200); border-radius:12px; outline:none;">
            
            <input type="password" name="password" placeholder="Create Password" required
                   style="width:100%; margin-bottom:20px; padding:12px; border:1px solid var(--grey-200); border-radius:12px; outline:none;">
            
            <button type="submit" class="search-trigger" style="width:100%;">Sign Up</button>
        </form>
        
        <p style="margin-top:20px; font-size:0.8rem; color: var(--text-555);">
            Already have an account? <a th:href="@{/login}" style="color:var(--text-222); font-weight:600; text-decoration:none;">Login here</a>
        </p>
    </div>

</body>
</html>
