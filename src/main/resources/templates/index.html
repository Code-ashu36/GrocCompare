<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrocCompare Pro | Premium Minimalist</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">Groc<span>Compare</span></div>
            <div class="loader-ring"></div>
        </div>
    </div>

    <div id="app-content">
        <header class="main-header">
            <div class="header-inner">
                <div class="minimal-logo" onclick="location.reload()">Groc<span>Compare</span></div>
                <div class="header-search-bar">
                    <input type="text" id="header-query" placeholder="Search brands..." onkeypress="handleHeaderSearch(event)">
                </div>
                <div class="header-actions">
                    <span class="line-icon" id="dark-mode-toggle">🌓</span>
                </div>
            </div>
        </header>

        <section class="premium-hero">
            <div class="hero-container">
                <h1 class="hero-title">Find the best price.</h1>
                <div class="search-pill">
                    <select id="location-picker">
                        <option value="Delhi">Delhi</option>
                        <option value="Mumbai">Mumbai</option>
                    </select>
                    <input type="text" id="item-search" placeholder="Search products...">
                    <button id="search-btn" class="search-action-btn">Search</button>
                </div>
                <div class="popular-chips">
                    <button onclick="quickSearch('Milk')" class="pill-chip">Milk</button>
                    <button onclick="quickSearch('Tomato')" class="pill-chip">Tomato</button>
                </div>
            </div>
        </section>

        <main class="platform-container">
            <aside class="sidebar-panel">
                <nav class="vertical-nav">
                    <button onclick="switchView('compare')" id="nav-compare" class="nav-link active">Comparison Engine</button>
                    <button onclick="switchView('budget')" id="nav-budget" class="nav-link">Budget Assistant</button>
                </nav>
                <div class="filter-group-box">
                    <h4>Price Range</h4>
                    <input type="range" class="accent-range" min="0" max="5000" value="5000">
                </div>
            </aside>

            <section class="results-viewport">
                <div id="comparison-view" class="view-container">
                    <div id="results-summary" class="mini-summary"></div>
                    <div id="loader" class="hidden"><div class="spinner"></div></div>
                    <div id="comparison-results" class="clean-grid"></div>
                </div>

                <div id="budget-assistant" class="view-container hidden">
                    <div class="premium-card">
                        <h2>💸 Budget Coach</h2>
                        <div class="budget-input-row">
                            <input type="number" id="monthly-budget" placeholder="Budget">
                            <input type="number" id="household-size" placeholder="Size">
                            <button class="primary-grey-btn" onclick="handleCalculateBudget()">Strategy</button>
                        </div>
                        <div id="budget-results"></div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="premium-footer">
            <div class="footer-inner">
                <div class="footer-brand">Groc<span>Compare</span></div>
                <div class="footer-links-row">
                    <div class="link-col">
                        <h5>Engine</h5>
                        <a href="javascript:void(0)" onclick="switchView('compare')">Grocery</a>
                    </div>
                </div>
            </div>
            <div class="footer-legal">&copy; 2025 GrocCompare Pro.</div>
        </footer>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
