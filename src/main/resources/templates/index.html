<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrocCompare – Minimal Price Discovery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <header class="header">
        <div class="header-container">
            <div class="logo">Groc<span>Compare</span></div>
            <div class="header-search">
                <input type="text" id="header-query" placeholder="Search brands...">
            </div>
            <div class="header-icons">
                <span class="icon">👤</span>
                <span class="icon">♡</span>
                <span class="icon">🔔</span>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Find the best price.</h1>
            <div class="main-search-container">
                <select id="location-picker">
                    <option value="Delhi">Delhi</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Bangalore">Bangalore</option>
                </select>
                <input type="text" id="item-search" placeholder="Search products, brands, or categories" value="Amul Taaza Milk 1L">
                <button id="search-btn">Search</button>
            </div>
            <div class="popular-searches">
                <span>Popular:</span>
                <button onclick="quickSearch('Milk')" class="pill">Milk</button>
                <button onclick="quickSearch('Tomato')" class="pill">Tomato</button>
                <button onclick="quickSearch('Sugar')" class="pill">Sugar</button>
            </div>
        </div>
    </section>

    <main class="main-layout">
        <aside class="sidebar">
            <div class="filter-group">
                <h4>Sort By</h4>
                <select id="sort-filter">
                    <option value="low">Price: Low to High</option>
                    <option value="high">Price: High to Low</option>
                </select>
            </div>
            <div class="filter-group">
                <h4>In Stock</h4>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="coach-card">
                <p><strong>Coach Tip:</strong> Items like Protein Bars have higher rates. Buy bulk to save.</p>
            </div>
        </aside>

        <section class="results-area">
            <div id="results-summary" class="summary-text"></div>
            
            <div id="loader" class="hidden">
                <div class="spinner"></div>
                <p id="loader-text"></p>
            </div>

            <div id="comparison-results" class="product-grid"></div>
        </section>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
