<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrocCompare Pro | All-in-One</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="glass-header">
        <div class="top-nav">
            <div class="logo">🚀 GrocCompare<span>Pro</span></div>
            <div class="nav-controls">
                <button id="dark-mode-toggle">🌓</button>
                <button class="login-btn">Login</button>
            </div>
        </div>
        <div class="category-wrapper">
            <button class="cat-btn active" onclick="switchCategory('grocery', this)">Grocery</button>
            <button class="cat-btn" onclick="switchCategory('cabs', this)">Cabs</button>
            <button class="cat-btn" onclick="switchCategory('appliances', this)">Appliances</button>
            <button class="cat-btn" onclick="switchCategory('subscriptions', this)">Plans</button>
        </div>
    </header>

    <div class="layout-container">
        <aside class="sidebar">
            <h3>Recent Searches</h3>
            <div id="history-list">
                <p class="empty-msg">No history yet.</p>
            </div>
        </aside>

        <main class="content-main">
            <div class="search-bar-container">
                <select id="location-picker">
                    <option value="Delhi">Delhi</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Bangalore">Bangalore</option>
                </select>
                <input type="text" id="item-search" placeholder="Search for groceries...">
                <button id="search-btn">Compare</button>
            </div>

            <div id="loader" class="hidden"><div class="spinner"></div></div>
            <section id="comparison-results" class="comparison-grid"></section>
        </main>
    </div>

    <footer class="glass-footer">
        <p>&copy; 2025 GrocCompare Pro. Intelligent Price Discovery.</p>
    </footer>

    <script src="/js/app.js"></script>
</body>
</html>
