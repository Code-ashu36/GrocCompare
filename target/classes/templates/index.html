<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrocCompare – Smart Savings Assistant</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <header class="header">
        <h1>⭐ GrocCompare</h1>
        <nav>
            <a href="javascript:void(0)" id="nav-compare" class="active-link">Compare Prices</a>
            <a href="javascript:void(0)" id="nav-budget">Budget Asst.</a>
            <button id="dark-mode-toggle">Toggle Dark Mode</button>
        </nav>
    </header>

    <main class="container" style="display: flex; gap: 25px; align-items: flex-start; max-width: 1400px; margin: 20px auto;">
        
        <aside id="shortcuts-sidebar" class="product-card" style="width: 260px; flex-shrink: 0; padding: 20px; position: sticky; top: 100px;">
            <h3 style="font-size: 1.1em; margin-bottom: 15px;">⚡ Quick Search</h3>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button onclick="quickSearch('Milk')" class="history-btn">🥛 Milk</button>
                <button onclick="quickSearch('Tomato')" class="history-btn">🍅 Tomato</button>
                <button onclick="quickSearch('Sugar')" class="history-btn">🍬 Sugar</button>
                <button onclick="quickSearch('Protein Bar')" class="history-btn">🍫 Protein Bar</button>
            </div>
            <hr style="margin: 20px 0; opacity: 0.1;">
            <div id="sidebar-coach-tip" style="font-size: 0.85em; opacity: 0.8; line-height: 1.4;">
                <strong>Coach Tip:</strong> Items like Protein Bars have higher rates because they are light. Buy boxes of 6+ to lower the unit cost!
            </div>
        </aside>

        <div id="main-content" style="flex-grow: 1;">
            <section id="comparison-view">
                <section class="search-area" style="display: flex; gap: 10px; margin-bottom: 20px; width: 100%;">
                    <select id="location-picker" style="padding: 12px; border-radius: 8px; border: 1px solid #ccc; background: white;">
                        <option value="Delhi">Delhi</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Bangalore">Bangalore</option>
                        <option value="Hyderabad">Hyderabad</option>
                    </select>
                    <input type="text" id="item-search" placeholder="Search for groceries..." value="Amul Taaza Milk 1L" style="flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc;">
                    <button id="search-btn" class="calculate-btn" style="width: auto; margin-bottom: 0; padding: 12px 25px;">Compare Prices</button>
                </section>

                <section id="results-summary" class="summary-box" style="display: none;"></section>

                <div id="loader" class="hidden" style="text-align: center; padding: 50px;">
                    <div class="spinner"></div>
                    <p id="loader-text" style="margin-top: 15px; color: #2a6fdb; font-weight: bold;"></p>
                </div>

                <section id="comparison-results" class="comparison-grid"></section>
            </section>

            <section id="budget-assistant" class="hidden-section">
                <h2 style="margin-bottom: 20px;">💸 Smart Budget Coach</h2>
                <div class="budget-input-area" style="padding: 25px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color);">
                    <div style="margin-bottom: 15px;">
                        <label>Monthly Target (₹):</label>
                        <input type="number" id="monthly-budget" value="15000" style="width: 100%; margin-top: 5px;">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label>Family Size:</label>
                        <input type="number" id="household-size" value="4" style="width: 100%; margin-top: 5px;">
                    </div>
                    <button id="calculate-budget-btn" class="calculate-btn">Generate Strategy</button>
                </div>
                <div id="budget-results" class="summary-box recommendation-box" style="margin-top: 25px; min-height: 100px;">
                    <h3 style="color: white;">Enter details to generate your coach strategy.</h3>
                </div>
            </section>
        </div>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
