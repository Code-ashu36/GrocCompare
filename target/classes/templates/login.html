<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GrocCompare | Login</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body style="background: var(--grey-100); height: 100vh; display: flex; align-items: center; justify-content: center;">

    <div style="background: var(--white); padding: 40px; border-radius: 24px; box-shadow: var(--shadow-light); width: 350px; text-align: center;">
        <h2 style="margin-bottom: 20px;">Welcome Back</h2>

        <div th:if="${param.error}" style="color: #ff4d4d; margin-bottom: 15px; font-size: 0.85rem;">
            Invalid username or password.
        </div>
        
        <div th:if="${param.logout}" style="color: #2d5a2d; margin-bottom: 15px; font-size: 0.85rem;">
            You have been logged out.
        </div>

        <form th:action="@{/login}" method="post">
            <input type="text" name="username" placeholder="Username" required
                   style="width:100%; margin-bottom:15px; padding:12px; border:1px solid var(--grey-200); border-radius:12px; outline:none;">
            
            <input type="password" name="password" placeholder="Password" required
                   style="width:100%; margin-bottom:20px; padding:12px; border:1px solid var(--grey-200); border-radius:12px; outline:none;">
            
            <button type="submit" class="search-trigger" style="width:100%;">Sign In</button>
        </form>

        <p style="margin-top:20px; font-size:0.8rem; color: var(--text-555);">
            New to GrocCompare? <a th:href="@{/register}" style="color:var(--text-222); font-weight:600; text-decoration:none;">Create Account</a>
        </p>
    </div>

</body>
</html>
